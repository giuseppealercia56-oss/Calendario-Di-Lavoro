<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content">
<meta name="theme-color" content="#eef1f6" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0f1522" media="(prefers-color-scheme: dark)">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Turni">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<style>
html, body { overflow-x: hidden; max-width: 100%; }
:root { color-scheme: light; padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
body { margin: 0; }
[hidden] { display: none !important; }
</style>
<title>Calendario Turni</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: one-column month calendar like a phone calendar app; tapping a day opens a bottom sheet to set shift and rate the day. */
:root {
  --bg: #eef1f6;
  --surface: #ffffff;
  --ink: #141c2b;
  --muted: #667085;
  --line: #d9dfe9;
  --accent: #2b4fd8;
  --on-accent: #ffffff;
  --mat-bg: #fdecc8;
  --mat-fg: #7a4a00;
  --pom-bg: #dfe5fd;
  --pom-fg: #2338a6;
  --rest-bg: #e8ecf3;
  --ot-bg: #ffe1cf;
  --ot-fg: #8a3a00;
  --low-bg: #fbdcd9;
  --low-fg: #a3261b;
  --mid-bg: #fdecc8;
  --mid-fg: #7a4a00;
  --high-bg: #d3f0dc;
  --high-fg: #166534;
  --bar-low: #e5564a;
  --bar-mid: #e8a23a;
  --bar-high: #2fa35c;
  --shadow: 0 -8px 40px rgba(20, 28, 43, 0.22);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Trebuchet MS", system-ui, sans-serif;
  --font-body: "Figtree", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0f1522;
    --surface: #182033;
    --ink: #e9edf6;
    --muted: #93a0b8;
    --line: #2a3550;
    --accent: #7f9bff;
    --on-accent: #0f1522;
    --mat-bg: #4a3510;
    --mat-fg: #f6c97a;
    --pom-bg: #26346f;
    --pom-fg: #b9c6ff;
    --rest-bg: #202a40;
    --ot-bg: #5c2f14;
    --ot-fg: #ffc59e;
    --low-bg: #5a2420;
    --low-fg: #ffb4ac;
    --mid-bg: #4a3510;
    --mid-fg: #f6c97a;
    --high-bg: #174a2c;
    --high-fg: #a5e8bd;
    --bar-low: #ef7468;
    --bar-mid: #eeb25a;
    --bar-high: #4cc57c;
    --shadow: 0 -8px 40px rgba(0, 0, 0, 0.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0f1522;
  --surface: #182033;
  --ink: #e9edf6;
  --muted: #93a0b8;
  --line: #2a3550;
  --accent: #7f9bff;
  --on-accent: #0f1522;
  --mat-bg: #4a3510;
  --mat-fg: #f6c97a;
  --pom-bg: #26346f;
  --pom-fg: #b9c6ff;
  --rest-bg: #202a40;
  --ot-bg: #5c2f14;
  --ot-fg: #ffc59e;
  --low-bg: #5a2420;
  --low-fg: #ffb4ac;
  --mid-bg: #4a3510;
  --mid-fg: #f6c97a;
  --high-bg: #174a2c;
  --high-fg: #a5e8bd;
  --bar-low: #ef7468;
  --bar-mid: #eeb25a;
  --bar-high: #4cc57c;
  --shadow: 0 -8px 40px rgba(0, 0, 0, 0.6);
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  background: var(--bg);
  color: var(--ink);
  font-family: var(--font-body);
  font-size: 15px;
  line-height: 1.4;
  padding-block: 18px 96px;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}
button { font: inherit; color: inherit; cursor: pointer; }
button:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.app { max-width: 520px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }

.head { display: flex; align-items: flex-end; justify-content: space-between; gap: 8px; min-width: 0; }
.month { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: clamp(20px, 7vw, 32px); line-height: 1; letter-spacing: -0.02em; text-transform: capitalize; min-width: 0; white-space: nowrap; }
.month small { display: block; font-family: var(--font-body); font-weight: 600; font-size: 13px; letter-spacing: 0.08em; color: var(--muted); margin-bottom: 6px; }
.nav { display: flex; gap: 4px; flex: none; }
.nav button { height: 38px; min-width: 36px; padding: 0 9px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); font-weight: 600; }
.nav .today { color: var(--accent); }
.head { position: relative; }
.menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 18; min-width: 210px; max-width: 100%; display: grid; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; box-shadow: 0 8px 24px rgba(20, 28, 43, 0.18); overflow: hidden; }
.menu[hidden] { display: none; }
.menu button { display: grid; gap: 2px; text-align: left; padding: 10px 14px; border: 0; border-bottom: 1px solid var(--line); background: none; color: var(--ink); font-size: 14px; }
.menu button:last-child { border-bottom: 0; }
.menu b { font-weight: 600; }
.menu small { font-size: 12px; color: var(--muted); }

.stats { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 6px; }
.stat { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 8px 8px; min-width: 0; }
.stat span { display: block; font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.stat b { font-family: var(--font-display); font-size: 20px; font-weight: 800; font-variant-numeric: tabular-nums; }

.wd, .grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.wd span { text-align: center; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); padding-block: 2px; }
.wd span:nth-child(n+6) { opacity: 0.7; }

.day { min-height: 98px; padding: 6px 4px 5px; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1px solid var(--line); border-radius: 10px; background: var(--surface); text-align: center; }
.day.rest { background: transparent; }
.day.blank { border: 0; background: transparent; pointer-events: none; }
.day .n { font-size: 14px; font-weight: 700; width: 24px; height: 24px; line-height: 24px; border-radius: 50%; font-variant-numeric: tabular-nums; }
.day.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.day.today .n { background: var(--accent); color: var(--on-accent); }
.day.sel { border-color: var(--ink); }
.pill { font-size: 10.5px; font-weight: 700; padding: 2px 5px; border-radius: 6px; font-variant-numeric: tabular-nums; white-space: nowrap; }
.pill.M { background: var(--mat-bg); color: var(--mat-fg); }
.pill.P { background: var(--pom-bg); color: var(--pom-fg); }
.pill.R { background: transparent; color: var(--muted); font-weight: 500; }
.pill.X { background: var(--ot-bg); color: var(--ot-fg); }
.pill.A { background: var(--low-bg); color: var(--low-fg); }
.pill.C { background: var(--rest-bg); color: var(--muted); }
.hrs { font-size: 11px; font-weight: 600; color: var(--muted); font-variant-numeric: tabular-nums; }
.bot { margin-top: auto; display: flex; flex-direction: column; align-items: center; gap: 3px; }
.ot { font-size: 11px; font-weight: 700; padding: 1px 5px; border-radius: 6px; background: var(--ot-bg); color: var(--ot-fg); font-variant-numeric: tabular-nums; white-space: nowrap; }
.score { font-size: 12px; font-weight: 700; padding: 1px 6px; border-radius: 6px; font-variant-numeric: tabular-nums; }
.score.low { background: var(--low-bg); color: var(--low-fg); }
.score.mid { background: var(--mid-bg); color: var(--mid-fg); }
.score.high { background: var(--high-bg); color: var(--high-fg); }
.score.part { background: var(--rest-bg); color: var(--muted); font-weight: 600; }

.legend { display: flex; flex-wrap: wrap; gap: 8px 14px; font-size: 12.5px; color: var(--muted); align-items: center; }
.legend i { font-style: normal; display: inline-flex; align-items: center; gap: 6px; }
.rules { background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 13px; color: var(--muted); display: grid; gap: 4px; }
.rules b { color: var(--ink); font-weight: 600; }
.hint { margin: 0; font-size: 13px; color: var(--muted); }

.backdrop { position: fixed; inset: 0; background: rgba(10, 14, 24, 0.45); z-index: 20; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 30; margin-inline: auto; max-width: 520px; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 18px 18px 0 0; box-shadow: var(--shadow); padding-top: 18px; padding-bottom: calc(18px + env(safe-area-inset-bottom, 0px)); padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 14px; }
@media (prefers-reduced-motion: no-preference) { .sheet { animation: up 0.18s ease-out; } }
@keyframes up { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-top { display: flex; justify-content: space-between; align-items: center; gap: 12px; }
.sheet h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; letter-spacing: -0.01em; }
.close { height: 36px; width: 36px; border-radius: 50%; border: 1px solid var(--line); background: var(--bg); font-size: 18px; line-height: 1; }
.sec h3 { margin: 0 0 6px; font-size: 11px; font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase; color: var(--muted); }
.opts { display: grid; gap: 6px; grid-template-columns: repeat(auto-fit, minmax(110px, 1fr)); }
.opt { display: flex; flex-direction: column; align-items: flex-start; gap: 1px; padding: 9px 11px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); text-align: left; }
.opt b { font-weight: 600; }
.opt small { color: var(--muted); font-size: 12px; font-variant-numeric: tabular-nums; }
.opt[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.opt[aria-pressed="true"] small { color: var(--on-accent); opacity: 0.85; }
.step { display: flex; align-items: center; gap: 10px; }
.stepbtn { height: 46px; width: 54px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); font-size: 24px; line-height: 1; font-weight: 600; flex: none; }
.stepval { flex: 1; min-width: 0; text-align: center; display: flex; flex-direction: column; }
.stepval b { font-family: var(--font-display); font-size: 24px; font-weight: 800; font-variant-numeric: tabular-nums; }
.stepval small { color: var(--muted); font-size: 12.5px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.chip { padding: 6px 12px; border-radius: 16px; border: 1px solid var(--line); background: var(--bg); font-size: 13px; font-weight: 600; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ot-bg); color: var(--ot-fg); border-color: var(--ot-fg); }
.dchips { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 4px; }
.dchips .chip { padding: 9px 0; border-radius: 10px; text-align: center; }
.dchips .chip[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--on-accent); }
.hrows { display: grid; gap: 8px; }
.hrow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; font-size: 14px; }
.hrow b { min-width: 92px; font-weight: 600; }
.hrow label { color: var(--muted); font-size: 13px; }
.hrow select { font: inherit; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.hcard { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; }
.hc-main { display: flex; flex-direction: column; min-width: 0; flex: 1; }
.hc-l { font-size: 10px; font-weight: 600; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.hc-v { font-family: var(--font-display); font-size: 28px; font-weight: 800; line-height: 1.1; font-variant-numeric: tabular-nums; }
.hc-side { display: flex; flex-direction: column; align-items: flex-end; min-width: 0; }
.hc-side b { font-size: 16px; font-variant-numeric: tabular-nums; }
.hc-chev { font-size: 24px; color: var(--muted); line-height: 1; }
.daytot { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 10px; padding: 10px 12px; border-radius: 10px; background: var(--bg); font-size: 14px; }
.daytot b { font-family: var(--font-display); font-size: 22px; font-weight: 800; font-variant-numeric: tabular-nums; }
.daytot small { color: var(--muted); font-size: 12.5px; }
.sec h3.sub { margin-top: 14px; }
.fld, .crow { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.fld label, .crow label { color: var(--muted); font-size: 13px; }
input[type="date"] { font: inherit; padding: 8px; border-radius: 10px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); min-width: 0; }
.clist { display: grid; gap: 6px; margin-bottom: 8px; }
.citem { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 6px 6px 6px 12px; border: 1px solid var(--line); border-radius: 10px; font-size: 14px; font-variant-numeric: tabular-nums; }
.citem button { border: 0; background: none; font-size: 22px; line-height: 1; padding: 4px 10px; color: var(--muted); }
.sgrid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; }
.sgrid .stat b { font-size: 22px; }
.scroll { overflow-x: auto; }
.eq { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; font-size: 14px; }
.eq th, .eq td { text-align: right; padding: 9px 5px; border-bottom: 1px solid var(--line); }
.eq th:first-child, .eq td:first-child { text-align: left; padding-left: 0; }
.eq td:first-child { font-weight: 600; }
.eq th { font-size: 11px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); font-weight: 700; }
.actions.stick { position: sticky; bottom: 0; background: var(--surface); padding-top: 10px; margin-top: 2px; border-top: 1px solid var(--line); }
.fab { position: fixed; right: max(16px, env(safe-area-inset-right, 0px)); bottom: calc(16px + env(safe-area-inset-bottom, 0px)); z-index: 15; width: 56px; height: 56px; border-radius: 50%; border: 0; background: var(--accent); color: var(--on-accent); box-shadow: 0 6px 20px rgba(20, 28, 43, 0.3); display: grid; place-items: center; }
.sheet.chat { height: 88%; overflow: hidden; gap: 8px; padding-bottom: 0; }
.chat-head { display: flex; align-items: center; gap: 8px; flex: none; }
.chat-head h2 { margin: 0; flex: 1; font-family: var(--font-display); font-weight: 800; font-size: 24px; }
.badge { font-size: 11px; font-weight: 700; padding: 3px 8px; border-radius: 10px; background: var(--rest-bg); color: var(--muted); white-space: nowrap; }
.badge.ai { background: var(--high-bg); color: var(--high-fg); }
.keypanel { flex: none; display: grid; gap: 8px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 10px; background: var(--bg); }
.keypanel input { font: inherit; font-size: 16px; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); min-width: 0; }
.msgs { flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 4px 2px; }
.msg { max-width: 90%; padding: 9px 12px; border-radius: 14px; font-size: 14.5px; line-height: 1.4; white-space: pre-wrap; overflow-wrap: anywhere; }
.msg.u { align-self: flex-end; background: var(--accent); color: var(--on-accent); border-bottom-right-radius: 4px; }
.msg.a { align-self: flex-start; background: var(--bg); border-bottom-left-radius: 4px; }
.msg.err { background: var(--low-bg); color: var(--low-fg); }
.msg .undo { display: block; margin-top: 6px; padding: 4px 0; border: 0; background: none; color: var(--accent); font-weight: 700; text-decoration: underline; }
.sugg { flex: none; display: flex; gap: 6px; overflow-x: auto; padding-bottom: 2px; }
.sugg .chip { white-space: nowrap; }
.inrow { flex: none; display: flex; gap: 8px; padding-top: 6px; padding-bottom: calc(12px + env(safe-area-inset-bottom, 0px)); }
.inrow input { flex: 1; min-width: 0; font: inherit; font-size: 16px; padding: 11px 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--bg); color: var(--ink); }
.inrow .send { padding: 0 16px; border: 0; border-radius: 12px; background: var(--accent); color: var(--on-accent); font-weight: 700; }
.inrow .send:disabled { opacity: 0.5; }
.total { display: grid; gap: 6px; }
.total-row { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
.total-n { font-family: var(--font-display); font-weight: 800; font-size: 44px; line-height: 1; font-variant-numeric: tabular-nums; }
.total-n small { font-family: var(--font-body); font-size: 15px; font-weight: 600; color: var(--muted); }
.total-note { font-size: 13px; color: var(--muted); text-align: right; }
.bar { height: 8px; border-radius: 4px; background: var(--rest-bg); overflow: hidden; }
.bar i { display: block; height: 100%; border-radius: 4px; background: var(--bar-mid); }
.bar i.low { background: var(--bar-low); }
.bar i.high { background: var(--bar-high); }
.actions { display: flex; gap: 8px; align-items: center; justify-content: space-between; }
.link { background: none; border: 0; color: var(--muted); text-decoration: underline; padding: 6px 0; font-size: 13px; }
.status { font-size: 13px; color: var(--low-fg); min-height: 1em; }
</style>

</head>
<body>
<div class="app">
  <div class="head">
    <h1 class="month" id="monthTitle"></h1>
    <div class="nav">
      <button id="menuBtn" type="button" aria-label="Menu" aria-haspopup="true" aria-expanded="false"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" aria-hidden="true" style="display:block;margin:auto"><path d="M5 7h14M5 12h14M5 17h14"/></svg></button>
      <button id="prev" type="button" aria-label="Mese precedente">‹</button>
      <button id="today" class="today" type="button">Oggi</button>
      <button id="next" type="button" aria-label="Mese successivo">›</button>
    </div>
    <div class="menu" id="menu" role="menu" hidden>
      <button type="button" role="menuitem" data-m="hours"><b>Ore lavorate</b><small id="mnHours"></small></button>
      <button type="button" role="menuitem" data-m="cfg"><b>Impostazioni turni</b></button>
      <button type="button" role="menuitem" data-m="chat"><b>Assistente</b></button>
    </div>
  </div>

  <div class="stats">
    <div class="stat"><span>Valutati</span><b id="stN">0</b></div>
    <div class="stat"><span>Media</span><b id="stAvg">–</b></div>
    <div class="stat"><span>Migliore</span><b id="stMax">–</b></div>
    <div class="stat"><span>Extra</span><b id="stOt">0 h</b></div>
  </div>


  <div>
    <div class="wd" aria-hidden="true"><span>Lun</span><span>Mar</span><span>Mer</span><span>Gio</span><span>Ven</span><span>Sab</span><span>Dom</span></div>
  </div>
  <div class="grid" id="grid"></div>

  <p class="hint" id="hint">Tocca un giorno per valutarlo o cambiare il turno.</p>

  <div class="legend" id="legend"></div>
  <div class="rules" id="rules"></div>
</div>

<button type="button" class="fab" id="chatFab" aria-label="Apri l’assistente"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 5.5A2.5 2.5 0 0 1 6.5 3h11A2.5 2.5 0 0 1 20 5.5v8a2.5 2.5 0 0 1-2.5 2.5H11l-4.5 4v-4h0A2.5 2.5 0 0 1 4 13.5z"/><path d="M12 6.8v4.4M9.8 9h4.4"/></svg></button>
<div class="backdrop" id="backdrop" hidden></div>
<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle" hidden></div>

<script>
(function () {
  var MESI = ["gennaio","febbraio","marzo","aprile","maggio","giugno","luglio","agosto","settembre","ottobre","novembre","dicembre"];
  var GIORNI = ["Domenica","Lunedì","Martedì","Mercoledì","Giovedì","Venerdì","Sabato"];
  var WD = ["Lun","Mar","Mer","Gio","Ven","Sab","Dom"];
  var G = [["male","Male",10],["indifferente","Indifferente",25],["bene","Bene",45],["eccezionale","Eccezionale",60]];
  var V = [["lenta","Lenta",10],["media","Media",25],["veloce","Veloce",40]];
  function pts(list, key) { for (var i = 0; i < list.length; i++) if (list[i][0] === key) return list[i][2]; return null; }
  function clone(o) { return JSON.parse(JSON.stringify(o)); }

  // Turni. Senza impostazioni salvate: lun-ven, alternati, settimana di lunedì 26/10/2026 al pomeriggio.
  var DEF = { days: [true, true, true, true, true, false, false], alt: true, refMonday: "2026-10-26", shift: "P", hours: { M: [6, 14], P: [14, 22] } };
  var cfg = clone(DEF);
  var cfgSaved = false;
  function validCfg(c) {
    try {
      return c && Array.isArray(c.days) && c.days.length === 7 && typeof c.alt === "boolean" &&
        /^\d{4}-\d{2}-\d{2}$/.test(c.refMonday) && (c.shift === "M" || c.shift === "P") &&
        ["M", "P"].every(function (k) {
          var h = c.hours && c.hours[k];
          return Array.isArray(h) && h.length === 2 && h.every(function (x) { return Number.isInteger(x) && x >= 0 && x <= 23; });
        });
    } catch (e) { return false; }
  }

  // Ore lavorate. Chi aveva già dati nell'app parte con questi valori, chi installa da zero parte vuoto.
  var work = { start: "", daily: 8, closures: [] };
  var workSaved = false;
  function isIso(s) { return typeof s === "string" && /^\d{4}-\d{2}-\d{2}$/.test(s); }
  function validWork(w) {
    try {
      return w && (w.start === "" || isIso(w.start)) && typeof w.daily === "number" && w.daily > 0 && w.daily <= 16 &&
        Array.isArray(w.closures) && w.closures.every(function (c) { return Array.isArray(c) && c.length === 2 && isIso(c[0]) && isIso(c[1]) && c[0] <= c[1]; });
    } catch (e) { return false; }
  }

  function pad(n) { return (n < 10 ? "0" : "") + n; }
  function iso(y, m, d) { return y + "-" + pad(m + 1) + "-" + pad(d); }
  function dayNum(y, m, d) { return Math.floor(Date.UTC(y, m, d) / 86400000); }
  function dow(y, m, d) { return (new Date(y, m, d).getDay() + 6) % 7; } // 0 = lunedì
  function parseIso(s) { var p = s.split("-").map(Number); return [p[0], p[1] - 1, p[2]]; }
  function toNum(s) { var p = parseIso(s); return dayNum(p[0], p[1], p[2]); }
  function numToDate(n) { var d = new Date(n * 86400000); return [d.getUTCFullYear(), d.getUTCMonth(), d.getUTCDate()]; }
  function fmtDate(s) { var p = parseIso(s); return p[2] + " " + MESI[p[1]].slice(0, 3) + " " + p[0]; }
  function fmtLong(s) { var p = parseIso(s); return p[2] + " " + MESI[p[1]] + " " + p[0]; }
  function fmt(n) { return String(n).replace(".", ","); }
  function nf(x, dec) {
    var p = Math.pow(10, dec), v = Math.round(x * p) / p;
    var parts = String(Math.abs(v)).split(".");
    parts[0] = parts[0].replace(/\B(?=(\d{3})+(?!\d))/g, ".");
    return (v < 0 ? "-" : "") + parts.join(",");
  }
  function hhmm(x) { x = x % 24; var h = Math.floor(x), mi = Math.round((x - h) * 60); return pad(h) + ":" + pad(mi); }
  function band(t) { return t >= 70 ? "high" : t >= 40 ? "mid" : "low"; }
  function total(rec) {
    if (!rec || !rec.g || !rec.v) return null;
    var a = pts(G, rec.g), b = pts(V, rec.v);
    return a == null || b == null ? null : a + b;
  }

  // ---------- turni ----------
  function weekShiftFor(c, monNum) {
    if (!c.alt) return c.shift;
    var r = parseIso(c.refMonday);
    var w = Math.floor((monNum - dayNum(r[0], r[1], r[2])) / 7);
    return w % 2 === 0 ? c.shift : (c.shift === "P" ? "M" : "P");
  }
  function defaultShift(y, m, d) {
    var w = dow(y, m, d);
    if (!cfg.days[w]) return "R";
    return weekShiftFor(cfg, dayNum(y, m, d) - w);
  }
  function hoursLabel(code, c) { var h = (c || cfg).hours[code]; return h[0] + "–" + h[1]; }
  function shiftOf(y, m, d, rec) { return (rec && rec.t) || defaultShift(y, m, d); }

  // ---------- ore lavorate ----------
  var now, todayNum = 0, startNum = null, closureNums = [];
  function setToday() { now = new Date(); todayNum = dayNum(now.getFullYear(), now.getMonth(), now.getDate()); }
  function rebuildWork() {
    startNum = work.start ? toNum(work.start) : null;
    closureNums = work.closures.map(function (c) { return [toNum(c[0]), toNum(c[1])]; });
  }
  function inClosure(n) { for (var i = 0; i < closureNums.length; i++) if (n >= closureNums[i][0] && n <= closureNums[i][1]) return true; return false; }
  function tracking() { return startNum !== null; }
  function inRange(n) { return tracking() && n >= startNum && n <= todayNum; }
  function kindOf(n, wd) { if (!cfg.days[wd]) return "off"; return inClosure(n) ? "closure" : "work"; }
  // Giorni passati (prima di oggi), di lavoro e non di chiusura: contano le ore di una giornata normale.
  function autoBase(n, wd) { return (tracking() && n >= startNum && n < todayNum && kindOf(n, wd) === "work") ? work.daily : 0; }
  function hasW(rec) { return !!rec && typeof rec.w === "number"; }
  function baseOf(n, wd, rec) { if (!inRange(n)) return 0; return hasW(rec) ? rec.w : autoBase(n, wd); }
  function hoursOf(n, wd, rec) { if (!inRange(n)) return 0; return baseOf(n, wd, rec) + (rec && rec.o ? rec.o : 0); }
  function keyInfo(key) { var p = key.split("-").map(Number); return { y: p[0], m: p[1] - 1, d: p[2], n: dayNum(p[0], p[1] - 1, p[2]), wd: dow(p[0], p[1] - 1, p[2]) }; }

  function totals() {
    var t = { hours: 0, ot: 0, present: 0, absent: 0, closed: 0 };
    if (!tracking()) return t;
    for (var n = startNum; n <= todayNum; n++) {
      var c = numToDate(n), wd = dow(c[0], c[1], c[2]);
      var rec = data[iso(c[0], c[1], c[2])];
      var base = baseOf(n, wd, rec), o = rec && rec.o ? rec.o : 0;
      t.hours += base + o; t.ot += o;
      if (base + o > 0) t.present++;
      var k = kindOf(n, wd);
      if (k === "work" && base === 0 && (n < todayNum || hasW(rec))) t.absent++;
      if (k === "closure" && base === 0) t.closed++;
    }
    return t;
  }

  var view = null;
  var sel = null;      // giorno aperto
  var mode = null;     // "day" | "cfg" | "tot" | null
  var draft = null;    // bozza impostazioni
  var firstRun = false;
  var data = {};
  var LS = "calendario-turni-giorni";
  var LSC = "calendario-turni-impostazioni";
  var LSW = "calendario-turni-lavoro";
  var $ = function (id) { return document.getElementById(id); };

  function loadLocal() {
    try { var s = localStorage.getItem(LS); if (s) data = JSON.parse(s) || {}; } catch (e) {}
    try {
      var c = localStorage.getItem(LSC);
      if (c) { var o = JSON.parse(c); if (validCfg(o)) { cfg = o; cfgSaved = true; } }
    } catch (e) {}
    try {
      var w = localStorage.getItem(LSW);
      if (w) { var ow = JSON.parse(w); if (validWork(ow)) { work = ow; workSaved = true; } }
    } catch (e) {}
  }
  function saveLocal() { try { localStorage.setItem(LS, JSON.stringify(data)); } catch (e) {} }
  function saveCfg() { try { localStorage.setItem(LSC, JSON.stringify(cfg)); } catch (e) {} }
  function saveWork() { try { localStorage.setItem(LSW, JSON.stringify(work)); } catch (e) {} }

  // ---------- mese ----------
  function render() {
    $("monthTitle").innerHTML = "<small>" + view.y + "</small>" + MESI[view.m];
    var first = dow(view.y, view.m, 1);
    var count = new Date(view.y, view.m + 1, 0).getDate();
    var html = "";
    var i;
    for (i = 0; i < first; i++) html += '<div class="day blank"></div>';
    var rated = 0, sum = 0, best = null, otSum = 0, monthH = 0;
    for (var d = 1; d <= count; d++) {
      var key = iso(view.y, view.m, d);
      var rec = data[key];
      var n = dayNum(view.y, view.m, d), wd = dow(view.y, view.m, d);
      var t = shiftOf(view.y, view.m, d, rec);
      var tot = total(rec);
      var ot = rec && rec.o ? rec.o : 0;
      var hrs = hoursOf(n, wd, rec);
      monthH += hrs;
      otSum += ot;
      if (tot != null) { rated++; sum += tot; if (best == null || tot > best) best = tot; }
      var kind = kindOf(n, wd);
      var absentDay = inRange(n) && kind === "work" && baseOf(n, wd, rec) === 0 && (n < todayNum || hasW(rec));
      var closedDay = kind === "closure" && !(hasW(rec) && rec.w > 0);
      var isToday = n === todayNum;
      var cls = "day" + (t === "R" ? " rest" : "") + (isToday ? " today" : "") + (mode === "day" && sel === key ? " sel" : "");
      var label = t === "R" ? "Riposo" : hoursLabel(t);
      var badge = "";
      if (ot > 0) badge += '<span class="ot">+' + fmt(ot) + "h</span>";
      if (tot != null) badge += '<span class="score ' + band(tot) + '">' + tot + "</span>";
      else if (rec && (rec.g || rec.v)) badge += '<span class="score part">…</span>';
      if (badge) badge = '<span class="bot">' + badge + "</span>";
      var pillCls, pillTxt, said;
      if (absentDay) { pillCls = "A"; pillTxt = "Assente"; said = "assente"; }
      else if (closedDay) { pillCls = "C"; pillTxt = "Chiusura"; said = "chiusura aziendale"; }
      else if (t === "R") { pillCls = (ot > 0 || hrs > 0) ? "X" : "R"; pillTxt = (ot > 0 || hrs > 0) ? "Extra" : "–"; said = "riposo"; }
      else { pillCls = t; pillTxt = label; said = label; }
      html += '<button type="button" class="' + cls + '" data-d="' + key + '" aria-label="' + d + " " + MESI[view.m] + ", " + said +
        (hrs > 0 ? ", " + fmt(hrs) + " ore lavorate" : "") +
        (ot > 0 ? ", straordinario " + fmt(ot) + " ore" : "") + (tot != null ? ", punteggio " + tot : "") + '">' +
        '<span class="n">' + d + '</span><span class="pill ' + pillCls + '">' + pillTxt + "</span>" +
        (hrs > 0 ? '<span class="hrs">' + fmt(hrs) + " h</span>" : "") + badge + "</button>";
    }
    $("grid").innerHTML = html;
    $("stN").textContent = rated;
    $("stAvg").textContent = rated ? (Math.round(sum / rated * 10) / 10).toString().replace(".", ",") : "–";
    $("stMax").textContent = best == null ? "–" : best;
    $("stOt").textContent = fmt(otSum) + " h";
    $("hint").hidden = rated > 0 || otSum > 0;
    $("mnHours").textContent = tracking() ? nf(totals().hours, 1) + " h in totale \u00b7 questo mese " + nf(monthH, 1) + " h" : "imposta da quando lavori";
  }
  function renderLegend() {
    $("legend").innerHTML =
      '<i><span class="pill M">' + hoursLabel("M") + "</span> Mattina</i>" +
      '<i><span class="pill P">' + hoursLabel("P") + "</span> Pomeriggio</i>" +
      '<i><span class="pill R">Riposo</span></i>' +
      (tracking() ? '<i><span class="pill A">Assente</span></i><i><span class="pill C">Chiusura</span></i>' : "") +
      '<i><span class="ot">+2h</span> Straordinario</i>';
  }

  // ---------- scheda del giorno ----------
  function presenceHtml(k) {
    if (!tracking() || k.n < startNum) return "";
    if (k.n > todayNum) return '<div class="sec"><h3>Presenza al lavoro</h3><p class="hint">Potrai segnare le ore quando arriverà il giorno.</p></div>';
    var rec = data[sel] || {};
    var kind = kindOf(k.n, k.wd);
    var explicit = hasW(rec);
    var base = baseOf(k.n, k.wd, rec);
    var present = explicit ? rec.w > 0 : base > 0;
    var absent = explicit && rec.w === 0;
    var o = rec.o || 0;
    var h = '<div class="sec"><h3>Presenza al lavoro</h3><div class="opts">';
    h += '<button type="button" class="opt" data-pres="1" aria-pressed="' + present + '"><b>Presente</b><small>' + (present ? fmt(base) + " ore" : "Segna le ore") + "</small></button>";
    h += '<button type="button" class="opt" data-pres="0" aria-pressed="' + absent + '"><b>Assente</b><small>0 ore</small></button>';
    h += "</div>";
    if (present) {
      h += '<div class="step" style="margin-top:8px"><button type="button" class="stepbtn" data-wstep="-0.5" aria-label="Meno mezz’ora">−</button><div class="stepval"><b>' + fmt(base) + ' h</b><small>Ore della giornata</small></div><button type="button" class="stepbtn" data-wstep="0.5" aria-label="Più mezz’ora">+</button></div>';
    }
    if (!explicit && !present && !absent) {
      if (kind === "closure") h += '<p class="hint" style="margin-top:8px">Chiusura aziendale: 0 ore.</p>';
      else if (kind === "off") h += '<p class="hint" style="margin-top:8px">Giorno di riposo: 0 ore.</p>';
      else h += '<p class="hint" style="margin-top:8px">Giornata di oggi: tocca Presente per contarla. Se non fai nulla, da domani conterà ' + fmt(work.daily) + " h.</p>";
    }
    var totalH = base + o;
    h += '<div class="daytot"><span>Ore lavorate nel giorno</span><span style="text-align:right"><b>' + fmt(totalH) + " h</b>" + (o > 0 ? "<br><small>" + fmt(base) + " h + " + fmt(o) + " h di straordinario</small>" : "") + "</span></div>";
    if (explicit) h += '<button type="button" class="link" id="wreset">Ripristina il valore predefinito</button>';
    h += "</div>";
    return h;
  }
  function renderDay() {
    var k = keyInfo(sel), y = k.y, m = k.m, d = k.d;
    var rec = data[sel] || {};
    var cur = shiftOf(y, m, d, rec);
    var tot = total(rec);
    var wd = GIORNI[new Date(y, m, d).getDay()];
    var TURNI = [["M", "Mattina", hoursLabel("M")], ["P", "Pomeriggio", hoursLabel("P")], ["R", "Riposo", ""]];
    var h = '<div class="sheet-top"><h2 id="sheetTitle">' + wd + " " + d + " " + MESI[m] + '</h2><button type="button" class="close" id="close" aria-label="Chiudi">×</button></div>';
    h += '<div class="sec"><h3>Turno</h3><div class="opts">';
    TURNI.forEach(function (x) {
      h += '<button type="button" class="opt" data-k="t" data-v="' + x[0] + '" aria-pressed="' + (cur === x[0]) + '"><b>' + x[1] + "</b><small>" + (x[2] || "giorno libero") + "</small></button>";
    });
    h += "</div></div>";
    h += presenceHtml(k);
    var o = rec.o || 0;
    var end = cur === "R" ? 0 : cfg.hours[cur][1];
    var onote = o === 0 ? "Nessuno" : cur === "R" ? "Giorno di riposo lavorato" : "Esci alle " + hhmm(end + o) + " invece che alle " + hhmm(end);
    h += '<div class="sec"><h3>Straordinario</h3><div class="step"><button type="button" class="stepbtn" data-step="-0.5" aria-label="Meno mezz’ora">−</button><div class="stepval"><b>' + fmt(o) + ' h</b><small>' + onote + '</small></div><button type="button" class="stepbtn" data-step="0.5" aria-label="Più mezz’ora">+</button></div><div class="chips">';
    [1, 2, 3, 4, 8].forEach(function (x) { h += '<button type="button" class="chip" data-set="' + x + '" aria-pressed="' + (o === x) + '">' + x + " h</button>"; });
    h += "</div></div>";
    h += '<div class="sec"><h3>Com’è andata</h3><div class="opts">';
    G.forEach(function (x) {
      h += '<button type="button" class="opt" data-k="g" data-v="' + x[0] + '" aria-pressed="' + (rec.g === x[0]) + '"><b>' + x[1] + "</b><small>+" + x[2] + " punti</small></button>";
    });
    h += "</div></div>";
    h += '<div class="sec"><h3>Quanto è passata in fretta</h3><div class="opts">';
    V.forEach(function (x) {
      h += '<button type="button" class="opt" data-k="v" data-v="' + x[0] + '" aria-pressed="' + (rec.v === x[0]) + '"><b>' + x[1] + "</b><small>+" + x[2] + " punti</small></button>";
    });
    h += "</div></div>";
    var note = tot != null ? "" : (!rec.g && !rec.v ? "Scegli gradimento e velocità" : !rec.g ? "Manca il gradimento" : "Manca la velocità");
    h += '<div class="total"><div class="total-row"><div class="total-n">' + (tot != null ? tot : "–") + "<small> / 100</small></div><div class=\"total-note\">" + note + "</div></div>";
    h += '<div class="bar"><i class="' + (tot != null ? band(tot) : "") + '" style="width:' + (tot != null ? tot : 0) + '%"></i></div></div>';
    h += '<div class="actions"><button type="button" class="link" id="clear">Cancella valutazione</button><button type="button" class="opt" id="done" style="align-items:center;min-width:96px"><b>Fatto</b></button></div>';
    $("sheet").innerHTML = h;
  }

  // ---------- pagina del totale ----------
  function renderTot() {
    var T = totals();
    var h = '<div class="sheet-top"><h2 id="sheetTitle">Ore lavorate</h2><button type="button" class="close" id="close" aria-label="Chiudi">×</button></div>';
    h += '<div class="total"><div class="total-row"><div class="total-n">' + nf(T.hours, 1) + "<small> h</small></div>";
    h += '<div class="total-note">dal ' + fmtLong(work.start) + "<br>a oggi, " + GIORNI[now.getDay()].toLowerCase() + " " + now.getDate() + " " + MESI[now.getMonth()] + "</div></div></div>";
    h += '<div class="sgrid">';
    [["Giorni di presenza", nf(T.present, 0)], ["Assenze", nf(T.absent, 0)], ["Giorni di chiusura", nf(T.closed, 0)], ["Straordinari", nf(T.ot, 1) + " h"]].forEach(function (x) {
      h += '<div class="stat"><span>' + x[0] + "</span><b>" + x[1] + "</b></div>";
    });
    h += "</div>";
    var perWeek = Math.max(1, cfg.days.filter(Boolean).length), perYear = perWeek * 52;
    var d24 = T.hours / 24;
    var wdn = T.hours / work.daily;
    h += '<div class="sec"><h3>In giorni, mesi e anni</h3><div class="scroll"><table class="eq"><thead><tr><th></th><th>Giorni</th><th>Mesi</th><th>Anni</th></tr></thead><tbody>';
    h += "<tr><td>Ore continue (24 h al giorno)</td><td>" + nf(d24, 1) + "</td><td>" + nf(d24 / 30.4375, 2) + "</td><td>" + nf(d24 / 365.25, 2) + "</td></tr>";
    h += "<tr><td>Giornate di lavoro (" + fmt(work.daily) + " h)</td><td>" + nf(wdn, 1) + "</td><td>" + nf(wdn / (perYear / 12), 1) + "</td><td>" + nf(wdn / perYear, 2) + "</td></tr>";
    h += "</tbody></table></div>";
    h += '<p class="hint" style="margin-top:8px">Ore continue: 1 giorno = 24 h, 1 mese = 30,4 giorni, 1 anno = 365,25 giorni. Giornate di lavoro: 1 giorno = ' + fmt(work.daily) + " h, 1 anno = " + perYear + " giornate, 1 mese = un dodicesimo di anno.</p></div>";
    h += '<div class="actions"><button type="button" class="link" data-act="chat">Cambia date e chiusure con la chat</button><button type="button" class="opt" id="done" style="align-items:center;min-width:96px"><b>Fatto</b></button></div>';
    $("sheet").innerHTML = h;
  }

  // ---------- impostazioni ----------
  function weekInfo() {
    var wd = dow(now.getFullYear(), now.getMonth(), now.getDate());
    var a = new Date(now.getFullYear(), now.getMonth(), now.getDate() - wd);
    var b = new Date(a.getFullYear(), a.getMonth(), a.getDate() + 6);
    var ma = MESI[a.getMonth()].slice(0, 3), mb = MESI[b.getMonth()].slice(0, 3);
    var range = a.getMonth() === b.getMonth() ? a.getDate() + "–" + b.getDate() + " " + ma : a.getDate() + " " + ma + " – " + b.getDate() + " " + mb;
    return { monday: a, range: range };
  }
  function hourOpts(s) {
    var o = "";
    for (var i = 0; i < 24; i++) o += '<option value="' + i + '"' + (i === s ? " selected" : "") + ">" + i + ":00</option>";
    return o;
  }
  function renderCfg() {
    var wk = weekInfo();
    var W = draft.work;
    var h = '<div class="sheet-top"><h2 id="sheetTitle">Impostazioni</h2><button type="button" class="close" id="cancel" aria-label="Chiudi">×</button></div>';
    if (firstRun) h += '<p class="hint">Prima di iniziare, scegli i tuoi turni. Potrai cambiarli quando vuoi con l’icona in alto. Da quando lavori e le chiusure aziendali le imposti poi scrivendo alla chat (il pulsante in basso a destra).</p>';
    h += '<div class="sec"><h3>Giorni di lavoro</h3><div class="dchips">';
    WD.forEach(function (n, i) { h += '<button type="button" class="chip" data-wd="' + i + '" aria-pressed="' + draft.days[i] + '">' + n + "</button>"; });
    h += "</div></div>";
    h += '<div class="sec"><h3>Come si alternano i turni</h3><div class="opts">';
    h += '<button type="button" class="opt" data-cfg="alt" data-v="1" aria-pressed="' + draft.alt + '"><b>Alternati</b><small>Cambiano ogni settimana</small></button>';
    h += '<button type="button" class="opt" data-cfg="alt" data-v="0" aria-pressed="' + (!draft.alt) + '"><b>Sempre uguale</b><small>Stesso turno ogni settimana</small></button>';
    h += "</div></div>";
    h += '<div class="sec"><h3>' + (draft.alt ? "Questa settimana (" + wk.range + ") fai" : "Che turno fai") + '</h3><div class="opts">';
    [["M", "Mattina"], ["P", "Pomeriggio"]].forEach(function (x) {
      h += '<button type="button" class="opt" data-cfg="shift" data-v="' + x[0] + '" aria-pressed="' + (draft.shift === x[0]) + '"><b>' + x[1] + "</b><small>" + hoursLabel(x[0], draft) + "</small></button>";
    });
    h += "</div>";
    if (draft.alt) h += '<p class="hint" style="margin-top:6px">Dalla settimana dopo si invertono, e così via.</p>';
    h += "</div>";
    h += '<div class="sec"><h3>Orari dei turni</h3><div class="hrows">';

  // ---- chiusure aziendali ----
  function mergeClosures(list) {
    var arr = list.map(function (c) { return [toNum(c[0]), toNum(c[1])]; }).sort(function (x, y) { return x[0] - y[0]; });
    var out = [];
    arr.forEach(function (c) {
      var last = out[out.length - 1];
      if (last && c[0] <= last[1] + 1) last[1] = Math.max(last[1], c[1]); else out.push([c[0], c[1]]);

    return out.map(function (c) { return [isoOf(c[0]), isoOf(c[1])]; });
  }
  function opClosure(action, a, b) {
    if (b < a) { var t0 = a; a = b; b = t0; }
    if (b - a > 800) return { ok: false, message: "Il periodo è troppo lungo." };
    var lab = rangeLabel(a, b), wd = workDaysIn(a, b);
    var wtxt = wd ? " (" + plural(wd, "giorno di lavoro", "giorni di lavoro") + ")" : "";
    if (action === "add") {

      work.closures.push([isoOf(a), isoOf(b)]);

      commitWork();
      return { ok: true, mutated: true, message: "Chiusura aziendale aggiunta: " + lab + wtxt + "." + totalNote() };
    }
    var out = [], hit = false;
    work.closures.forEach(function (c) {
      var s = toNum(c[0]), e = toNum(c[1]);
      if (e < a || s > b) { out.push(c); return; }

  }

  // ---- giorni (presenza, ore, straordinari, turno, valutazione) ----
  function opSetDays(a, b, spec) {

      if (spec.overtime != null) { var ov = clampH(spec.overtime); if (ov > 0) rec.o = ov; else delete rec.o; }
      if (spec.shift) { if (spec.shift === "default" || spec.shift === defaultShift(c[0], c[1], c[2])) delete rec.t; else rec.t = spec.shift; }
      if (spec.g !== undefined) { if (spec.g === "none") delete rec.g; else rec.g = spec.g; }
      if (spec.v !== undefined) { if (spec.v === "none") delete rec.v; else rec.v = spec.v; }

    else if (pres === "default") parts.push("presenza ripristinata");

  function summaryOf(a, b) {

  var MON_FULL = "(gennaio|febbraio|marzo|aprile|maggio|giugno|luglio|agosto|settembre|ottobre|novembre|dicembre)";

  // Anno per una data senza anno: per le azioni la più vicina (con un po' di preferenza per il passato), per le domande la più recente già passata.
  function pickYear(d, m, ref, pref) {
    var y0 = now.getFullYear(), best = null, bestScore = 1e9;
    for (var y = y0 - 2; y <= y0 + 2; y++) {
      var n = dayNum(y, m, d), c = numToDate(n);

      else if (pref === "past") { if (n > todayNum) continue; score = todayNum - n; }
      else score = n <= todayNum ? todayNum - n : (n - todayNum) * 1.6;
      if (score < bestScore) { bestScore = score; best = n; }
    }

  function findTokens(t) {

      var T = totals(), d24 = T.hours / 24, perYear = Math.max(1, cfg.days.filter(Boolean).length) * 52, wdn = T.hours / work.daily;
      return "Hai lavorato " + nf(T.hours, 1) + " h in totale.\n• Ore continue (24 h al giorno): " + nf(d24, 1) + " giorni, " + nf(d24 / 30.4375, 2) + " mesi, " + nf(d24 / 365.25, 2) + " anni.\n• Giornate di lavoro (" + fmt(work.daily) + " h): " + nf(wdn, 1) + " giorni, " + nf(wdn / (perYear / 12), 1) + " mesi, " + nf(wdn / perYear, 2) + " anni.";
    }
    if (c.q === "hours") return qLabel(r) + ": " + nf(S.hours, 1) + " h lavorate (" + plural(S.present, "giorno di presenza", "giorni di presenza") + (S.absent ? ", " + plural(S.absent, "assenza", "assenze") : "") + ").";
    return "Posso dirti ore lavorate, straordinari, assenze, chiusure, turni, punteggio medio e da quando lavori. Prova per esempio «quante ore ho lavorato a ottobre?».";
  }

  function execClause(c) {
    var R = c.ranges, res = { lines: [], mutated: false, need: null };
    function push(r) { if (!r) return; res.lines.push(r.message); if (r.mutated) res.mutated = true; }
    function need(text, what) { res.lines.push(text); res.need = what; }
    if (c.q) { res.lines.push(execQuery(c)); return res; }
    if (c.setStart) {
      if (!R.length) { need("Da che giorno lavori? Per esempio «lavoro dal 15 settembre 2025».", "dates"); return res; }
      push(opSetWork({ start: isoOf(R[0].a) })); return res;
    }
    if (c.setDaily != null) { push(opSetWork({ daily: c.setDaily })); return res; }
    if (c.closureRemove || c.closureAdd) {
      if (!R.length) { need(SUGGEST_DATES, "dates"); return res; }
      R.forEach(function (r) { push(opClosure(c.closureRemove ? "remove" : "add", r.a, r.b)); });
      return res;
    }
    if (c.reset) {
      if (!R.length) { need(SUGGEST_DATES, "dates"); return res; }
      R.forEach(function (r) { push(opSetDays(r.a, r.b, { presence: "default", overtime: 0, shift: "default" })); });
      return res;
    }
    if (c.needOT && c.overtime == null) { need("Quante ore di straordinario? (per esempio «2 ore»)", "ot"); return res; }
    var spec = specOf(c);
    if (!spec) { res.unknown = true; return res; }
    var rs = R.length ? R : [{ a: todayNum, b: todayNum }];
    if (spec.shift && Object.keys(spec).length === 1 && rs.length === 1 && rs[0].weekly) {
      push(opWeekShift(rs[0].a, spec.shift)); return res;
    }
    rs.forEach(function (r) { push(opSetDays(r.a, r.b, spec)); });
    return res;
  }

  function runParser(text) {
    var t = norm(text);
    if (UNDO_RE.test(t)) return doUndo();
    if (HELP_RE.test(t)) return { text: helpText() };
    if (HELLO_RE.test(t) && t.length < 25) return { text: "Ciao! Dimmi cosa devo fare: chiusure, assenze, ore, straordinari, turni o una domanda sui totali." };
    if (pending) {
      var p = pending; pending = null;
      var c2 = parseClause(t, "near");
      if (p.need === "dates" && c2.ranges.length && !hasIntent(c2)) {
        var r1 = execClause(Object.assign({}, p.c, { ranges: c2.ranges }));
        return { text: r1.lines.join("\n"), mutated: r1.mutated };
      }
      if (p.need === "ot" && !hasIntent(c2)) {
        var hh = findHours(t), v = hh.length ? hh[0].v : (/\b(\d{1,2}(?:[.,]\d)?)\b/.test(t) ? half(parseFloat(/\b(\d{1,2}(?:[.,]\d)?)\b/.exec(t)[1].replace(",", "."))) : null);
        if (v != null) {
          var r2 = execClause(Object.assign({}, p.c, { needOT: false, overtime: v }));
          return { text: r2.lines.join("\n"), mutated: r2.mutated };
        }
      }
    }
    var clauses = splitClauses(t), prev = null, lines = [], mutated = false, unknown = [];
    clauses.forEach(function (ct) {
      var pref = /\?/.test(ct) || Q_START_RE.test(ct) ? "past" : "near";
      var c = parseClause(ct, pref);
      if (!hasIntent(c)) {
        if (c.ranges.length && prev && !prev.q) c = Object.assign({}, prev, { ranges: c.ranges });
        else { unknown.push(ct); return; }
      } else if (!c.ranges.length && prev && prev.ranges.length && !c.q && !c.closureAdd && !c.closureRemove && !c.setStart && !c.reset && c.setDaily == null) {
        c.ranges = prev.ranges;
      }
      var r = execClause(c);
      if (r.unknown) { unknown.push(ct); return; }
      if (r.need) pending = { need: r.need, c: c };
      lines = lines.concat(r.lines);
      if (r.mutated) mutated = true;
      prev = c;
    });
    if (!lines.length) return { text: unknownText(), unknown: true };
    if (unknown.length) lines.push("Non ho capito: «" + unknown.join("», «") + "».");
    return { text: lines.join("\n"), mutated: mutated };
  }

  function helpText() {
    return "Posso fare queste cose:\n• Chiusure: «questa settimana è chiusura», «dal 24 dicembre al 6 gennaio chiusura», «togli la chiusura del 10 agosto»\n• Assenze: «ieri ero assente», «venerdì sono in ferie»\n• Ore: «ho lavorato 6 ore ieri», «oggi 2 ore di straordinario»\n• Turni: «domani faccio il mattino», «questa settimana faccio il pomeriggio»\n• Giornata: «oggi è andata bene ed è passata veloce»\n• Domande: «quante ore ho lavorato a ottobre?», «quanti giorni di chiusura ho?»\n• «Annulla» torna indietro.";
  }
  function unknownText() {
    return "Non ho capito. Prova per esempio:\n• «Questa settimana è chiusura»\n• «Ieri ero assente»\n• «Oggi 2 ore di straordinario»\n• «Quante ore ho lavorato a ottobre?»" + (getKey() ? "" : "\nPer frasi più libere puoi attivare l’AI con una chiave (icona ⚙).");
  }
  function doUndo() {

  // ================= ASSISTENTE: AI con chiave =================
  var AI_TOOLS = [

      input_schema: { type: "object", properties: { from: { type: "string" }, to: { type: "string" } }, required: ["from", "to"] } },

  function dateArg(s) {
    if (!validIso(s)) throw new Error("data non valida: " + s);
    return toNum(s);
  }
  function runTool(name, inp) {
    inp = inp || {};
    try {
      if (name === "set_closure") { var r = opClosure(inp.action === "remove" ? "remove" : "add", dateArg(inp.from), dateArg(inp.to)); return r; }
      if (name === "set_days") {
        var spec = {};
        if (inp.presence) spec.presence = inp.presence;
        if (inp.hours != null) spec.hours = Number(inp.hours);
        if (inp.overtime != null) spec.overtime = Number(inp.overtime);
        if (inp.shift) spec.shift = inp.shift;
        if (inp.gradimento) spec.g = inp.gradimento;
        if (inp.velocita) spec.v = inp.velocita;
        if (!Object.keys(spec).length) return { ok: false, message: "Nessuna modifica indicata." };
        return opSetDays(dateArg(inp.from), dateArg(inp.to || inp.from), spec);
      }
      if (name === "set_work_settings") {
        var o = {};
        if (inp.start) { dateArg(inp.start); o.start = inp.start; }
        if (inp.daily_hours) o.daily = Number(inp.daily_hours);
        if (!o.start && !o.daily) return { ok: false, message: "Nessuna impostazione indicata." };
        return opSetWork(o);
      }
      if (name === "set_week_shift") return opWeekShift(dateArg(inp.week_of), inp.shift === "P" ? "P" : "M");
      if (name === "get_summary") {
        var a = dateArg(inp.from), b = dateArg(inp.to);
        var S = summaryOf(a, Math.max(a, b));
        return { ok: true, from: inp.from, to: inp.to, hours: S.hours, overtime_hours: S.overtime, present_days: S.present, absent_days: S.absent, closure_days: S.closed, rated_days: S.rated, average_score: S.avg, total_hours_since_start: tracking() ? totals().hours : null };
      }
      if (name === "get_days") {
        var a2 = dateArg(inp.from), b2 = dateArg(inp.to);
        if (b2 - a2 > 61) return { ok: false, message: "Massimo 62 giorni per richiesta." };
        var days = [];
        for (var n = a2; n <= b2; n++) {
          var d = dayInfo(n);
          days.push({ date: isoOf(n), weekday: WD[d.wd], kind: d.kind, shift: d.shift, hours_ordinary: d.base, overtime: d.o, score: d.tot });
        }
        return { ok: true, days: days };
      }
      if (name === "undo_last_change") { var lab = undoLast(); return { ok: lab != null, mutated: false, message: lab != null ? "Annullato: " + lab : "Niente da annullare." }; }
      return { ok: false, message: "Strumento sconosciuto." };
    } catch (e) { return { ok: false, message: "Errore: " + e.message }; }
  }

  function aiSystem() {
    var cl = work.closures.map(function (c) { return c[0] + (c[1] !== c[0] ? " → " + c[1] : ""); }).join("; ") || "nessuna";
    var days = WD.filter(function (n, i) { return cfg.days[i]; }).join(", ");
    return "Sei l’assistente di un’app calendario dei turni di lavoro. Rispondi sempre in italiano, in modo breve e diretto.\n" +
      "Oggi è " + GIORNI[now.getDay()].toLowerCase() + " " + isoOf(todayNum) + ". Le settimane vanno da lunedì a domenica.\n" +
      "Impostazioni: lavora dal " + (work.start || "(non impostato)") + "; giornata normale " + work.daily + " h; giorni di lavoro: " + days + "; chiusure aziendali: " + cl + ".\n" +
      "Regole:\n- Per cambiare qualcosa usa SEMPRE gli strumenti. Non dire di aver fatto una modifica senza aver chiamato lo strumento.\n" +
      "- Le date degli strumenti sono nel formato AAAA-MM-GG. Se un giorno è indicato solo col nome (es. «venerdì») è quello della settimana corrente.\n" +
      "- Se manca un’informazione indispensabile (per esempio quali giorni), chiedila prima di agire.\n" +

      "- Dopo una modifica riassumi in una o due frasi, con le date esatte. L’utente può dire «annulla».\n" +
      "- Per domande sui totali usa get_summary o get_days e non indovinare.";
  }

  async function callAI(msgs) {
    var res = await fetch(API_URL, {
      method: "POST",
      headers: { "content-type": "application/json", "x-api-key": getKey(), "anthropic-version": "2023-06-01", "anthropic-dangerous-direct-browser-access": "true" },
      body: JSON.stringify({ model: AI_MODEL, max_tokens: 1024, system: aiSystem(), tools: AI_TOOLS, messages: msgs })
    });
    if (!res.ok) {
      var body = ""; try { body = await res.text(); } catch (e) {}
      var err = new Error("http " + res.status); err.status = res.status; err.body = body; throw err;
    }
    return res.json();
  }

  async function runAI(text) {
    var turn = [{ role: "user", content: text }];
    var all = function () { return aiTurns.concat([turn]).reduce(function (acc, t) { return acc.concat(t); }, []); };
    var mutated = false, finalText = "";
    for (var step = 0; step < 6; step++) {
      var out = await callAI(all());
      turn.push({ role: "assistant", content: out.content });
      var uses = (out.content || []).filter(function (b) { return b.type === "tool_use"; });
      if (out.stop_reason !== "tool_use" || !uses.length) {
        finalText = (out.content || []).filter(function (b) { return b.type === "text"; }).map(function (b) { return b.text; }).join("\n").trim();
        break;
      }
      var results = uses.map(function (u) {
        var r = runTool(u.name, u.input);
        if (r && r.mutated) mutated = true;
        return { type: "tool_result", tool_use_id: u.id, content: JSON.stringify(r) };
      });
      turn.push({ role: "user", content: results });
    }
    aiTurns.push(turn);
    if (aiTurns.length > 8) aiTurns.shift();
    return { text: finalText || (mutated ? "Fatto." : "Non ho una risposta."), mutated: mutated };
  }

  function aiErrorText(e) {

    if (e && e.status === 429) return "Troppe richieste in poco tempo. Riprova tra un minuto.";
    if (e && e.status === 400 && /credit/i.test(e.body || "")) return "Il credito dell’account API è finito. Ricaricalo sul sito di Anthropic.";
    if (e && e.status >= 500) return "Il servizio AI non risponde in questo momento.";
    return null;
  }
